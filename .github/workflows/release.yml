name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solux-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Calculate the next release with Cog
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: "0.63.2"
          auto-install: true
          cache: false
      - run: bun install --frozen-lockfile
      - uses: cocogitto/cocogitto-action@v4.1.0
        with:
          command: --version
      - name: Prepare or resume this run's release candidate
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts prepare

  checks:
    name: Verify the release candidate
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/quality-assurance.yml
    with:
      checkout-ref: ${{ needs.prepare.outputs.commit }}
    permissions:
      contents: read

  merge:
    name: Record checks, merge release metadata, and tag
    needs: [prepare, checks]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: "0.63.2"
          auto-install: true
          cache: false
      - name: Set the release tag identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge the verified metadata without bypassing branch protection
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_PR: ${{ needs.prepare.outputs.pr }}
        run: bun scripts/release.ts merge

  publish:
    name: Publish to npm and GitHub
    needs: [prepare, merge]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the merged and tagged release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.merge.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Make Moon's base branch available
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: "0.63.2"
          auto-install: true
          cache: false
      - name: Verify npm trusted publishing prerequisites
        run: |
          bun - <<'TS'
          import { execFileSync } from "node:child_process";
          const npm = execFileSync("proto", ["run", "npm", "--", "--version"], { encoding: "utf8" }).trim();
          const [major, minor, patch] = npm.split(".").map(Number);
          if (!Number.isInteger(major) || major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error("npm 11.5.1 or newer is required for trusted publishing");
          }
          if (process.env.GITHUB_ACTIONS !== "true" || !process.env.ACTIONS_ID_TOKEN_REQUEST_URL || !process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN) {
            throw new Error("GitHub Actions OIDC credentials are required");
          }
          console.log(`Publishing with Node ${execFileSync("node", ["--version"], { encoding: "utf8" }).trim()} and npm ${npm}`);
          TS
      - name: Verify the immutable release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: bun scripts/check-release.ts --require-main
      - run: bun install --frozen-lockfile
      - name: Build fresh artifacts and verify strict packed consumers
        run: |
          rm -rf packages/solux/dist
          bun moon run solux:build --force
          bun moon run solux:test-package
      - name: Pack only the public package
        working-directory: packages/solux
        run: bun pm pack --ignore-scripts --filename "$RUNNER_TEMP/solux.tgz"
      - name: Publish or resume, verify npm, and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ARCHIVE: ${{ runner.temp }}/solux.tgz
        run: bun scripts/release.ts publish
