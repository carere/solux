name: Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact commit to verify for a manual release
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: qa-${{ inputs.checkout-ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: All checks passed
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository and full history
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Make Moon's base branch available in detached checkouts
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi
      - name: Install and cache the pinned toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: "0.63.2"
          auto-install: true
          cache-base: main
      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile
      - name: Check package manifest sorting
        run: bun sort-package-json --check package.json 'apps/*/package.json' 'packages/*/package.json'
      - name: Check formatting, lint rules, and imports
        run: bun biome check . --error-on-warnings
      - name: Build the public package and website before static analysis
        run: bun moon run solux:build website:build
      - name: Check TypeScript types
        run: bun tsc --noEmit
      - name: Check unused code and dependencies
        # Use Knip's supported Bun runtime to avoid Node 24's Linux Wasm JIT crash.
        # https://github.com/nodejs/node/issues/66366
        run: bun --bun knip
      - name: Install Cocogitto for release integration tests
        uses: cocogitto/cocogitto-action@v4.1.0
        with:
          command: --version
      - name: Test release helpers
        run: bun test scripts/tests
      - name: Run library regressions in server and browser conditions
        run: bun moon run solux:test-unit solux:test-unit-browser
      - name: Verify packed declarations and runtime in strict consumers
        run: bun moon run solux:test-package
      - name: Install Chromium and its system dependencies
        working-directory: apps/website
        run: bun playwright install --with-deps chromium
      - name: Run website browser regressions
        run: bun moon run website:test-browser
      - name: Validate the Cloudflare deployment without uploading
        working-directory: apps/website
        # Invoke Wrangler directly: deploy-check is currently excluded from Moon CI.
        run: bun wrangler deploy --dry-run
      - name: Verify checks left tracked files unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
