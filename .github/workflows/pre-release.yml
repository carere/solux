name: Prepare Release PR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare a version, lockfile, and changelog PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main and full release history
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: "0.63.2"
          auto-install: true
          cache: false
      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile
      - name: Require the existing release baseline and no pending release PR
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD
          open_releases=$(gh pr list --base main --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("release/v"))] | length')
          if [ "$open_releases" != 0 ]; then
            echo 'Merge or close the pending release PR before preparing another.' >&2
            exit 1
          fi
          git diff --exit-code
          git diff --cached --exit-code
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Cocogitto and set the release commit identity
        uses: cocogitto/cocogitto-action@v4.1.0
        with:
          command: --version
      - name: Preserve legacy changelog history and prepare the next stable release
        run: |
          bun - <<'TS'
          import { readFileSync, writeFileSync } from "node:fs";
          const history = readFileSync("CHANGELOG.md", "utf8");
          if (!/^- - -$/m.test(history)) {
            writeFileSync("CHANGELOG.md", `# Changelog\n\n- - -\n\n${history}`);
          }
          TS
          # Cocogitto requires the separator before it runs pre-bump hooks.
          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "chore(release): preserve legacy history in Cocogitto changelog"
          fi
          cog bump --auto
      - name: Open the review PR without pushing the local Cocogitto tag
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_COMMIT: ${{ steps.baseline.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$BASE_COMMIT" ]; then
            echo 'No version-affecting changes to release.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          release_tag=$(git describe --tags --exact-match --match 'v[0-9]*' HEAD)
          RELEASE_TAG="$release_tag" bun scripts/check-release.ts
          bun - <<'TS'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const previous = execFileSync("git", ["show", `${process.env.BASE_COMMIT}:CHANGELOG.md`]);
          const current = readFileSync("CHANGELOG.md");
          if (!current.subarray(current.length - previous.length).equals(previous)) {
            throw new Error("Release preparation must preserve all existing changelog bytes");
          }
          TS
          while IFS= read -r path; do
            case "$path" in
              packages/solux/package.json|bun.lock|CHANGELOG.md) ;;
              *) echo "Unexpected release change: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE_COMMIT" HEAD)
          release_branch="release/$release_tag"
          git push origin "HEAD:refs/heads/$release_branch"
          cp .github/release-pr.md "$RUNNER_TEMP/release-pr.md"
          printf '\nPreparation run: %s\n' "$RUN_URL" >> "$RUNNER_TEMP/release-pr.md"
          gh pr create --base main --head "$release_branch" --title "chore(release): $release_tag" --body-file "$RUNNER_TEMP/release-pr.md" >> "$GITHUB_STEP_SUMMARY"
