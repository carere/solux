$schema: ../../.moon/cache/schemas/project.json
id: website
language: typescript
layer: application
stack: frontend
tasks:
  dev:
    command: bun vite --host 127.0.0.1
    deps:
      - solux:build
      - ~:i18n
    options:
      cache: false
      persistent: true
      runInCI: false
  i18n:
    command: bun scripts/i18n.mjs
    inputs:
      - messages/**/*
      - project.inlang/settings.json
      - i18n.config.mjs
      - scripts/i18n.mjs
    outputs:
      - src/paraglide
  typecheck:
    command: bun tsc --project tsconfig.json --noEmit
    deps:
      - solux:build
      - ~:i18n
  build:
    command: bun --bun vite build
    deps:
      - solux:build
      - ~:typecheck
    inputs:
      - src/**/*
      - messages/**/*
      - project.inlang/settings.json
      - i18n.config.mjs
      - scripts/i18n.mjs
      - wrangler.jsonc
      - vite.config.ts
      - /images/solux.svg
    outputs:
      - dist
      - .wrangler/deploy
    type: build
  preview:
    command: bun vite preview --host 127.0.0.1 --port 4173 --strictPort
    deps:
      - ~:build
    options:
      cache: false
      persistent: true
      runInCI: false
  test-browser:
    command: bun playwright test
    deps:
      - ~:build
    options:
      cache: false
  deploy-check:
    command: bun wrangler deploy --dry-run
    deps:
      - ~:build
    options:
      cache: false
      runInCI: false
  deploy:
    command: bun wrangler deploy
    deps:
      - ~:build
    options:
      cache: false
      runInCI: false
  deploy-preview:
    command: bun wrangler preview
    deps:
      - ~:build
    options:
      cache: false
      runInCI: false
