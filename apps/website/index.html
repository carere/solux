<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="description" content="Solux documentation. Typed events, reactive state, and explicit store lifecycles for SolidJS." />
    <link rel="icon" type="image/svg+xml" href="../../images/solux.svg" />
    <title>Introduction · Solux</title>
    <script>
      (() => {
        let preference = "system";
        try { preference = localStorage.getItem("solux-theme") || "system"; } catch {}
        const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
